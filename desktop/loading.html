<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pipesets</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #6366f1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { text-align: center; max-width: 520px; padding: 24px; }
    .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px;
            background: linear-gradient(135deg, #6366f1, #7c3aed); }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); }
    .spinner { width: 20px; height: 20px; margin: 18px auto 0; border-radius: 50%;
               border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
               animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    code { font-size: 12px; word-break: break-all; }
    .error h1 { color: #dc2626; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="logo"></div>
    <h1>Starting Pipesets…</h1>
    <p id="status">Starting the local engine</p>
    <div class="spinner"></div>
  </div>
  <script>
    // Poll the backend the desktop shell started, then hand over to the app.
    const base = window.__PIPESETS_API_BASE__
    const log = window.__PIPESETS_BACKEND_LOG__ || ''
    const deadline = Date.now() + 90_000

    function fail(reason) {
      document.getElementById('box').className = 'box error'
      document.getElementById('box').innerHTML =
        '<h1>Pipesets could not start</h1><p>' + reason + '</p>' +
        (log ? '<p style="margin-top:10px">Backend log: <code>' + log + '</code></p>' : '')
    }

    async function poll() {
      if (!base) return fail('The backend process could not be launched. Is backend/.venv set up? Run ./start.sh once.')
      try {
        const res = await fetch(base + '/health', { cache: 'no-store' })
        if (res.ok) return location.replace('index.html')
      } catch { /* not listening yet */ }
      if (Date.now() > deadline) return fail('The backend did not respond within 90 seconds.')
      document.getElementById('status').textContent = 'Starting the local engine (' +
        Math.round((90_000 - (deadline - Date.now())) / 1000) + 's)'
      setTimeout(poll, 400)
    }
    poll()
  </script>
</body>
</html>
