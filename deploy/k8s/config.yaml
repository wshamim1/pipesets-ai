apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: pipesets-ai
data:
  DEFAULT_LLM_PROVIDER: openai
  DEFAULT_LLM_MODEL: gpt-4
  DEFAULT_LLM_TEMPERATURE: "0.7"
  DEFAULT_LLM_MAX_TOKENS: "1024"
  DEFAULT_LLM_TOP_P: "1.0"
  LLM_BASE_URL: ""
  LANGFUSE_HOST: https://cloud.langfuse.com
  LANGFUSE_REDACT: "0"
  # Python tools run in the sandbox runner (sandbox.yaml); with isolation required they fail
  # rather than run inside the backend when it's down
  SANDBOX_URL: http://sandbox:8090
  SANDBOX_REQUIRE_ISOLATION: "1"
  EXTERNAL_AGENT_ALLOW_PRIVATE: "0"
  EXTERNAL_AGENT_ALLOWED_HOSTS: ""
  # Days audit log entries are kept; 0 = forever
  AUDIT_RETENTION_DAYS: "365"
  # Rate limits, login lockouts and cancel signals: memory is per pod, so with several backend /
  # worker replicas use "database" (the shared DATABASE_URL) or "redis" (set REDIS_URL in
  # backend-secrets). auto = redis when REDIS_URL is set, else memory.
  PIPESETS_SHARED_STATE: auto
  # Traces over OTLP/HTTP when set, e.g. http://tempo.monitoring:4318 (auth headers, if any, go in
  # backend-secrets as OTEL_EXPORTER_OTLP_HEADERS). Prompt / output text stays out of spans unless
  # OTEL_CAPTURE_CONTENT is "1". Set METRICS_TOKEN in backend-secrets to require it on /metrics.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: pipesets-ai
  OTEL_CAPTURE_CONTENT: "0"
