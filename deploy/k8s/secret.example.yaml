# Not in kustomization.yaml on purpose (re-applying would wipe real keys).
# Copy, fill in, and apply once:  kubectl apply -f secret.example.yaml
# or:  kubectl -n pipesets-ai create secret generic backend-secrets \
#        --from-literal=OPENAI_API_KEY=sk-...
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: pipesets-ai
type: Opaque
stringData:
  # Encrypts the Secrets vault. Required: without it secrets are lost when the pod restarts.
  # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Better: leave it empty and set PIPESETS_MASTER_KEY_KMS (AWS KMS, via IRSA) or the Vault
  # variables instead, so the key never sits in plaintext here — see backend/.env.example.
  PIPESETS_MASTER_KEY: ""
  # Shared by the backend and the sandbox runner (sandbox.yaml). Required.
  # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SANDBOX_TOKEN: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
