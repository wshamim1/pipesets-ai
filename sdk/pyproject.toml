[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipesets-sdk"
version = "0.2.0"
description = "Python SDK and CLI for the Pipesets AI backend"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
test = ["pytest>=7"]   # `pipesets tool test`
mcp = ["mcp>=2.0; python_version >= '3.10'"]

[project.scripts]
pipesets = "pipesets.cli:main"
pipesets-mcp = "pipesets.mcp_server:main"

[tool.setuptools]
packages = ["pipesets"]
