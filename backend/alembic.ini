# Alembic config. The database URL comes from DATABASE_URL (see db.py), not from here.
#   python manage.py db setup         apply migrations + seed (what the server does at startup)
#   alembic revision -m "add x"       new migration in migrations/versions
#   alembic upgrade head --sql        print the DDL for the configured database instead of running it
[alembic]
script_location = %(here)s/migrations
